# Full stack for LAN / home network / port-forwarded access.
# Published: Postgres on 127.0.0.1:POSTGRES_HOST_PORT (→ :5432, localhost-only on the VM), API on API_PORT (→ :9091), web on WEB_PORT (→ :80).
#
#   cp .env.stack.example .env.stack
#   docker compose -f docker-compose.stack.yml --env-file .env.stack up -d --build
#
# Open http://localhost:${WEB_PORT:-9080}/ — nginx proxies /api to the API container.
# See README "Public / LAN access" for firewall, HTTPS, and security notes.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - tracker_pg_stack_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Localhost on the VM only — use SSH port forwarding from your laptop for DBeaver (do not open this port in Lightsail).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Lower on 1GB RAM instances if builds freeze the VM (try 512m; add swap on the host too).
        MAVEN_HEAP: ${MAVEN_BUILD_HEAP:-768m}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Fixed inside the stack so the web container can proxy to http://api:9091.
      SERVER_PORT: 9091
      SERVER_ADDRESS: 0.0.0.0
      TRACKER_AUTH_JWT_SECRET: ${TRACKER_AUTH_JWT_SECRET}
      TRACKER_AUTH_PASSWORD_PEPPER: ${TRACKER_AUTH_PASSWORD_PEPPER}
      TRACKER_AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${TRACKER_AUTH_BOOTSTRAP_ADMIN_PASSWORD}
      # Optional: directory-based Robinhood CSV import (paths as seen inside this container).
      # On Lightsail use host bind mounts (see docker-compose.robinhood.yml and .env.stack.example).
      TRACKER_FINANCE_ROBINHOOD_CSV_IMPORT_DIRECTORY: ${TRACKER_FINANCE_ROBINHOOD_CSV_IMPORT_DIRECTORY:/robinhood/import}
      TRACKER_FINANCE_ROBINHOOD_CSV_UPLOADED_DIRECTORY: ${TRACKER_FINANCE_ROBINHOOD_CSV_UPLOADED_DIRECTORY:/robinhood/uploaded}
      # Browser clients from other hosts / origins (override in .env.stack if needed)
      TRACKER_WEB_CORS_ALLOWED_ORIGIN_PATTERNS_0: ${CORS_PATTERN:-*}
    ports:
      # Host:container — API always listens on 9091 inside the container.
      - "${API_PORT:-9091}:9091"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-9080}:80"

volumes:
  # Survives `docker compose down`. Avoid `docker compose down -v` if you need to keep data.
  tracker_pg_stack_data:
