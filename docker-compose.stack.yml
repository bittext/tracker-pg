# Full stack for LAN / home network / port-forwarded access.
# Published: Postgres on 127.0.0.1:POSTGRES_HOST_PORT (→ :5432, localhost-only on the VM), API on API_PORT (→ :9091),
# web: host mapping WEB_PORT_BIND (default 9080:80). With Caddy HTTPS, use e.g. 127.0.0.1:9080:80 and open 80/443 for Caddy.
#
#   cp .env.stack.example .env.stack
#   docker compose -f docker-compose.stack.yml --env-file .env.stack up -d --build --remove-orphans
#
# Open http://localhost:9080/ when WEB_PORT_BIND=9080:80 — nginx proxies /api to the API container.
# See README "Public / LAN access" for firewall, HTTPS, and security notes.
#
# Pinned project name: same as base compose so merges (Caddy, Robinhood) and deploy scripts always target one project.
name: tracker-pg

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - tracker_pg_stack_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Localhost on the VM only — use SSH port forwarding from your laptop for DBeaver (do not open this port in Lightsail).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Lower on 1GB RAM instances if builds freeze the VM (try 512m; add swap on the host too).
        MAVEN_HEAP: ${MAVEN_BUILD_HEAP:-768m}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Fixed inside the stack so the web container can proxy to http://api:9091.
      SERVER_PORT: 9091
      SERVER_ADDRESS: 0.0.0.0
      TRACKER_AUTH_JWT_SECRET: ${TRACKER_AUTH_JWT_SECRET}
      TRACKER_AUTH_PASSWORD_PEPPER: ${TRACKER_AUTH_PASSWORD_PEPPER}
      TRACKER_AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${TRACKER_AUTH_BOOTSTRAP_ADMIN_PASSWORD}
      TRACKER_AUTH_SMS_ENABLED: ${TRACKER_AUTH_SMS_ENABLED:-false}
      TRACKER_AUTH_SMS_PROVIDER: ${TRACKER_AUTH_SMS_PROVIDER:-log}
      TRACKER_AUTH_SMS_AWS_REGION: ${TRACKER_AUTH_SMS_AWS_REGION:-}
      TRACKER_AUTH_SMS_SMS_TYPE: ${TRACKER_AUTH_SMS_SMS_TYPE:-TRANSACTIONAL}
      TRACKER_AUTH_SMS_SMS_SENDER_ID: ${TRACKER_AUTH_SMS_SMS_SENDER_ID:-}
      # Optional: directory-based Robinhood CSV import (paths as seen inside this container).
      # On Lightsail use host bind mounts (see docker-compose.robinhood.yml and .env.stack.example).
      TRACKER_FINANCE_ROBINHOOD_CSV_IMPORT_DIRECTORY: ${TRACKER_FINANCE_ROBINHOOD_CSV_IMPORT_DIRECTORY:-}
      TRACKER_FINANCE_ROBINHOOD_CSV_UPLOADED_DIRECTORY: ${TRACKER_FINANCE_ROBINHOOD_CSV_UPLOADED_DIRECTORY:-}
      # Set to true to resume outbound Alpha Vantage quote calls.
      TRACKER_FINANCE_ALPHA_VANTAGE_ENABLED: ${TRACKER_FINANCE_ALPHA_VANTAGE_ENABLED:-false}
      TRACKER_FINANCE_ALPHA_VANTAGE_API_KEY: ${TRACKER_FINANCE_ALPHA_VANTAGE_API_KEY:-}
      TRACKER_FINANCE_ALPHA_VANTAGE_BASE_URL: ${TRACKER_FINANCE_ALPHA_VANTAGE_BASE_URL:-https://www.alphavantage.co/query}
      # Finance stock alerts (Amazon SES + SNS). Leave disabled until providers are configured.
      TRACKER_FINANCE_ALERTS_EMAIL_ENABLED: ${TRACKER_FINANCE_ALERTS_EMAIL_ENABLED:-false}
      TRACKER_FINANCE_ALERTS_EMAIL_FROM: ${TRACKER_FINANCE_ALERTS_EMAIL_FROM:-}
      # ses (default) | smtp — when smtp, set SMTP_* vars below (AWS keys not required for email).
      TRACKER_FINANCE_ALERTS_EMAIL_TRANSPORT: ${TRACKER_FINANCE_ALERTS_EMAIL_TRANSPORT:-ses}
      TRACKER_FINANCE_ALERTS_SMTP_HOST: ${TRACKER_FINANCE_ALERTS_SMTP_HOST:-}
      TRACKER_FINANCE_ALERTS_SMTP_PORT: ${TRACKER_FINANCE_ALERTS_SMTP_PORT:-587}
      TRACKER_FINANCE_ALERTS_SMTP_USERNAME: ${TRACKER_FINANCE_ALERTS_SMTP_USERNAME:-}
      TRACKER_FINANCE_ALERTS_SMTP_PASSWORD: ${TRACKER_FINANCE_ALERTS_SMTP_PASSWORD:-}
      TRACKER_FINANCE_ALERTS_SMTP_DEBUG: ${TRACKER_FINANCE_ALERTS_SMTP_DEBUG:-false}
      TRACKER_FINANCE_ALERTS_SMS_ENABLED: ${TRACKER_FINANCE_ALERTS_SMS_ENABLED:-false}
      TRACKER_FINANCE_ALERTS_AWS_REGION: ${TRACKER_FINANCE_ALERTS_AWS_REGION:-}
      TRACKER_FINANCE_ALERTS_SMS_SMS_TYPE: ${TRACKER_FINANCE_ALERTS_SMS_SMS_TYPE:-TRANSACTIONAL}
      TRACKER_FINANCE_ALERTS_SMS_SENDER_ID: ${TRACKER_FINANCE_ALERTS_SMS_SENDER_ID:-}
      # Browser clients from other hosts / origins (override in .env.stack if needed)
      TRACKER_WEB_CORS_ALLOWED_ORIGIN_PATTERNS_0: ${CORS_PATTERN:-*}
      # Management → Account: AES-256-GCM seal of password + authenticator key at rest (empty = plaintext, dev only).
      TRACKER_MANAGEMENT_ACCOUNTS_ENCRYPTION_KEY: ${TRACKER_MANAGEMENT_ACCOUNTS_ENCRYPTION_KEY:-}
      # Journal attachments: leave empty for local disk (TRACKER_JOURNAL_STORAGE_DIR); set bucket for S3.
      TRACKER_JOURNAL_S3_BUCKET: ${TRACKER_JOURNAL_S3_BUCKET:-}
      TRACKER_JOURNAL_S3_REGION: ${TRACKER_JOURNAL_S3_REGION:-us-east-1}
      # Banking uploads + Plaid-generated QFX (see README / scripts/plaid-request.example.json).
      TRACKER_BANKING_IMPORT_DIRECTORY: ${TRACKER_BANKING_IMPORT_DIRECTORY:-}
      TRACKER_PLAID_ENABLED: ${TRACKER_PLAID_ENABLED:-false}
      TRACKER_PLAID_CLIENT_ID: ${TRACKER_PLAID_CLIENT_ID:-}
      TRACKER_PLAID_SECRET: ${TRACKER_PLAID_SECRET:-}
      TRACKER_PLAID_ENVIRONMENT: ${TRACKER_PLAID_ENVIRONMENT:-sandbox}
      TRACKER_PLAID_OUTPUT_SUBDIRECTORY: ${TRACKER_PLAID_OUTPUT_SUBDIRECTORY:-plaid}
      TRACKER_PLAID_ACCESS_TOKEN_ENCRYPTION_KEY: ${TRACKER_PLAID_ACCESS_TOKEN_ENCRYPTION_KEY:-}
      # Admin → Repository (GitHub): set enabled + owner + repo in .env.stack (optional token for private repo / traffic).
      TRACKER_GITHUB_ENABLED: ${TRACKER_GITHUB_ENABLED:-false}
      TRACKER_GITHUB_OWNER: ${TRACKER_GITHUB_OWNER:-}
      TRACKER_GITHUB_REPO: ${TRACKER_GITHUB_REPO:-}
      TRACKER_GITHUB_TOKEN: ${TRACKER_GITHUB_TOKEN:-}
      # Optional: default AWS credential chain for SES / SNS / S3 inside the container (omit if using another mechanism).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # Finance → Trading → Predicts (StockTwits ingestion + FinBERT sentiment).
      TRACKER_FINANCE_PREDICTS_ENABLED: ${TRACKER_FINANCE_PREDICTS_ENABLED:-true}
      TRACKER_FINANCE_PREDICTS_STOCKTWITS_ENABLED: ${TRACKER_FINANCE_PREDICTS_STOCKTWITS_ENABLED:-true}
      TRACKER_FINANCE_PREDICTS_REDDIT_ENABLED: ${TRACKER_FINANCE_PREDICTS_REDDIT_ENABLED:-false}
      TRACKER_FINANCE_PREDICTS_REDDIT_CLIENT_ID: ${TRACKER_FINANCE_PREDICTS_REDDIT_CLIENT_ID:-}
      TRACKER_FINANCE_PREDICTS_REDDIT_CLIENT_SECRET: ${TRACKER_FINANCE_PREDICTS_REDDIT_CLIENT_SECRET:-}
      TRACKER_FINANCE_PREDICTS_REDDIT_USER_AGENT: ${TRACKER_FINANCE_PREDICTS_REDDIT_USER_AGENT:-tracker-pg/7.2.0 (github.com/bittext/tracker-pg; finance-predicts)}
      TRACKER_FINANCE_PREDICTS_REDDIT_SUBREDDITS: ${TRACKER_FINANCE_PREDICTS_REDDIT_SUBREDDITS:-wallstreetbets,stocks,investing,options}
      TRACKER_FINANCE_PREDICTS_REDDIT_POSTS_PER_SUBREDDIT: ${TRACKER_FINANCE_PREDICTS_REDDIT_POSTS_PER_SUBREDDIT:-100}
      TRACKER_FINANCE_PREDICTS_REDDIT_POLL_SECONDS: ${TRACKER_FINANCE_PREDICTS_REDDIT_POLL_SECONDS:-900}
      TRACKER_FINANCE_PREDICTS_X_ENABLED: ${TRACKER_FINANCE_PREDICTS_X_ENABLED:-false}
      TRACKER_FINANCE_PREDICTS_FINBERT_ENABLED: ${TRACKER_FINANCE_PREDICTS_FINBERT_ENABLED:-true}
      TRACKER_FINANCE_PREDICTS_FINBERT_BASE_URL: ${TRACKER_FINANCE_PREDICTS_FINBERT_BASE_URL:-http://finbert:8000}
      TRACKER_FINANCE_PREDICTS_TRACKED_TICKER_QUOTA_PER_USER: ${TRACKER_FINANCE_PREDICTS_TRACKED_TICKER_QUOTA_PER_USER:-25}
      TRACKER_FINANCE_PREDICTS_BASELINE_WINDOW_DAYS: ${TRACKER_FINANCE_PREDICTS_BASELINE_WINDOW_DAYS:-30}
      TRACKER_FINANCE_PREDICTS_RETENTION_MENTIONS_DAYS: ${TRACKER_FINANCE_PREDICTS_RETENTION_MENTIONS_DAYS:-60}
    ports:
      # Host:container — API always listens on 9091 inside the container.
      - "${API_PORT:-9091}:9091"

  finbert:
    # FinBERT sentiment sidecar for Predicts (Python FastAPI + transformers).
    # Disabled implicitly when TRACKER_FINANCE_PREDICTS_FINBERT_ENABLED=false (Spring uses heuristic fallback).
    build:
      context: ./finbert-svc
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FINBERT_MODEL: ${FINBERT_MODEL:-ProsusAI/finbert}
      FINBERT_MAX_BATCH: ${FINBERT_MAX_BATCH:-64}
      FINBERT_MAX_TOKENS: ${FINBERT_MAX_TOKENS:-256}
      FINBERT_DEVICE: ${FINBERT_DEVICE:-cpu}
    volumes:
      - tracker_pg_stack_finbert_cache:/cache/huggingface
    # Not published on the host by default — only the api container needs it via the internal network.

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT_BIND:-9080:80}"

volumes:
  # Survives `docker compose down`. Avoid `docker compose down -v` if you need to keep data.
  tracker_pg_stack_data:
  # Hugging Face model cache for finbert-svc — avoids re-downloading ~440 MB on every container rebuild.
  tracker_pg_stack_finbert_cache:
