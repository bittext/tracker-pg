# Deploys pushed branches to an Ubuntu Lightsail instance over SSH.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   LIGHTSAIL_HOST     — public IP or DNS of the instance
#   LIGHTSAIL_SSH_KEY  — full private key (PEM) for SSH (same key pair as in Lightsail / your .pem)
#   LIGHTSAIL_USER     — optional; omit to default to ubuntu in the SSH step below
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   LIGHTSAIL_REPO_DIR              — absolute path to the clone on the server
#   LIGHTSAIL_USE_ROBINHOOD_COMPOSE — set to 1 to merge docker-compose.robinhood.yml
#   LIGHTSAIL_USE_CADDY             — optional; set to 1 to force Caddy merge. If unset, deploy still merges Caddy
#                                     when CADDY_DOMAIN is set in the server’s .env.stack (see scripts/lightsail-deploy.sh).
#   LIGHTSAIL_USE_ROBINHOOD_NOTEBOOK — optional; set to 1 to build/start robinhood-notebook. If unset, deploy still
#                                     does so when TRACKER_FINANCE_ROBINHOOD_NOTEBOOK_SERVICE_ENABLED=true in .env.stack.
#
# One-time on the Lightsail host:
#   - Install Docker Engine + Compose plugin; add ubuntu to the docker group if needed.
#   - git clone <this-repo-url> && cd tracker-pg && git checkout develop
#   - cp .env.stack.example .env.stack && edit (never commit .env.stack)
#   - chmod +x scripts/lightsail-deploy.sh
#   - ./scripts/lightsail-deploy.sh   # verify stack comes up
#
# Private GitHub repo: configure a read-only deploy key on the server (ssh-keygen, add public key
# in repo Deploy keys) or use a PAT in the git remote URL so `git pull` works.

name: Deploy pushed branch to Lightsail

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: deploy-lightsail-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  web-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Nav registry audit
        working-directory: web
        run: npm run test:nav

      - name: Build web
        working-directory: web
        run: npm run build

  deploy:
    needs: web-check
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          timeout: 2m
          command_timeout: 90m
          script: |
            set -euo pipefail
            BRANCH="${{ github.ref_name }}"
            REPO_DIR="${{ vars.LIGHTSAIL_REPO_DIR }}"
            REPO_DIR="${REPO_DIR:-/home/ubuntu/apps/tracker-pg}"
            cd "$REPO_DIR"
            git fetch origin "$BRANCH"
            if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
              git checkout "$BRANCH"
            else
              git checkout -b "$BRANCH" "origin/$BRANCH"
            fi
            git reset --hard "origin/$BRANCH"
            export TRACKER_ROBINHOOD_COMPOSE="${{ vars.LIGHTSAIL_USE_ROBINHOOD_COMPOSE }}"
            if [[ "${TRACKER_ROBINHOOD_COMPOSE:-}" != "1" ]]; then
              unset TRACKER_ROBINHOOD_COMPOSE
            fi
            export TRACKER_CADDY="${{ vars.LIGHTSAIL_USE_CADDY }}"
            if [[ "${TRACKER_CADDY:-}" != "1" ]]; then
              unset TRACKER_CADDY
            fi
            export TRACKER_ROBINHOOD_NOTEBOOK="${{ vars.LIGHTSAIL_USE_ROBINHOOD_NOTEBOOK }}"
            if [[ "${TRACKER_ROBINHOOD_NOTEBOOK:-}" != "1" ]]; then
              unset TRACKER_ROBINHOOD_NOTEBOOK
            fi
            bash scripts/lightsail-deploy.sh
