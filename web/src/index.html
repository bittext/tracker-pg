<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Health Tracker &amp; PFM (Personal Financial Management)</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f8">
  <link rel="icon" type="image/png" sizes="1024x1024" href="/tracker-app-icon-1024.png">
  <link rel="apple-touch-icon" href="/tracker-app-icon-1024.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;1,14..32,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('tracker.theme.v1');
        var cfg = raw ? JSON.parse(raw) : { preset: 'phoenix', mode: 'system' };
        var known = {
          phoenix: 1, openai: 1, classic: 1, aura: 1,
          aether: 1, lumen: 1, obsidian: 1, velvet: 1, atelier: 1,
          solace: 1, eclipse: 1, opal: 1, archive: 1, ember: 1
        };
        var preset = known[cfg.preset] ? cfg.preset : 'phoenix';
        var mode = cfg.mode;
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var root = document.documentElement;
        root.setAttribute('data-theme-preset', preset);
        root.setAttribute('data-theme-mode', mode);
        root.style.colorScheme = mode;
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
