<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content class="jr-body-dialog">
  @if (data.tagsLine && data.tagsLine !== '—') {
    <p class="muted jr-body-tags"><strong>Tags:</strong> {{ data.tagsLine }}</p>
  }
  <div class="markdown-body jr-body-md" [innerHTML]="data.bodyMarkdown | safeMarkdown"></div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">Close</button>
</mat-dialog-actions>
