<mat-tab-group
  class="rh-report-tabs"
  animationDuration="180ms"
  [selectedIndex]="journalNav.analyticsTabIndex()"
  (selectedIndexChange)="journalNav.analyticsTabIndex.set($event)"
>
  <mat-tab label="Daily Tracker">
    <div class="rh-report-tab-panel">
      <app-reports-finance-robinhood-daily-tracker />
    </div>
  </mat-tab>

  <mat-tab label="Trades">
    <div class="rh-report-tab-panel">
      @if (journalNav.analyticsTabIndex() === 1) {
        <app-reports-finance-robinhood-executed-trades />
      }
    </div>
  </mat-tab>

  <mat-tab label="Balances">
    <div class="rh-report-tab-panel">
      @if (journalNav.analyticsTabIndex() === 2) {
        <app-reports-finance-robinhood-period-balances />
      }
    </div>
  </mat-tab>

  <mat-tab label="Ownership history">
    <div class="rh-report-tab-panel">
      @if (journalNav.analyticsTabIndex() === 3) {
        <app-reports-finance-robinhood-ownership-history />
      }
    </div>
  </mat-tab>

  <mat-tab label="Journal">
    <div class="rh-report-tab-panel">
      @if (journalNav.analyticsTabIndex() === 4) {
        <app-trading-journal-panel />
      }
    </div>
  </mat-tab>
  <mat-tab label="Crypto Tracker">
    <div class="rh-report-tab-panel">
      <app-reports-finance-robinhood-crypto-tracker />
    </div>
  </mat-tab>
  <mat-tab label="Roadmap">
    <div class="rh-report-tab-panel">
      <app-markets-journey />
    </div>
  </mat-tab>
</mat-tab-group>
