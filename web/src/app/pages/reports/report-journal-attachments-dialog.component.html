<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content class="jr-att-dialog">
  @if (!data.attachments.length) {
    <p class="muted">No attachments for this entry.</p>
  } @else {
    <ul class="jr-att-list">
      @for (a of data.attachments; track a.id) {
        <li class="jr-att-item">
          <button
            type="button"
            class="jr-att-name jr-att-open"
            [disabled]="openingId === a.id"
            (click)="openAttachment(a)"
          >
            {{ a.originalFilename }}
          </button>
          @if (a.sizeBytes != null) {
            <span class="muted">{{ formatSize(a.sizeBytes) }}</span>
          }
        </li>
      }
    </ul>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">Close</button>
</mat-dialog-actions>
