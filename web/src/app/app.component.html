<mat-toolbar class="app-top-bar">
  <span class="brand">{{ title }}</span>
  <span class="spacer"></span>
  <span class="user-chip" *ngIf="authenticated">{{ username }}</span>
  <button mat-button type="button" *ngIf="authenticated" (click)="logout()">Log out</button>
</mat-toolbar>

<div class="shell">
  <section class="app-frame" aria-label="Main content" *ngIf="!onLoginRoute; else loginOnly">
    <header class="frame-tabs">
      <nav mat-tab-nav-bar class="tab-nav" [tabPanel]="tabPanel">
        <a
          mat-tab-link
          routerLink="/exercise"
          routerLinkActive
          #exTab="routerLinkActive"
          [active]="exTab.isActive"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Exercise
        </a>
        <a
          mat-tab-link
          routerLink="/finance"
          routerLinkActive
          #finTab="routerLinkActive"
          [active]="finTab.isActive"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Finance
        </a>
        <a
          mat-tab-link
          routerLink="/management"
          routerLinkActive
          #mgmtTab="routerLinkActive"
          [active]="mgmtTab.isActive"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Management
        </a>
        <a
          mat-tab-link
          routerLink="/reports"
          routerLinkActive
          #repTab="routerLinkActive"
          [active]="repTab.isActive"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Reports
        </a>
        <a
          mat-tab-link
          routerLink="/admin"
          routerLinkActive
          #adminTab="routerLinkActive"
          [active]="adminTab.isActive"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Admin
        </a>
        <a
          mat-tab-link
          routerLink="/logs"
          routerLinkActive
          #logsTab="routerLinkActive"
          [active]="logsTab.isActive"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Logs
        </a>
      </nav>
    </header>
    <mat-tab-nav-panel #tabPanel class="tab-panel">
      <main class="main">
        <router-outlet />
      </main>
    </mat-tab-nav-panel>
  </section>
  <ng-template #loginOnly>
    <main class="main login-main">
      <router-outlet />
    </main>
  </ng-template>
</div>
