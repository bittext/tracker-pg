<mat-toolbar class="app-top-bar">
  <span class="brand">{{ title }}</span>
  <span class="spacer"></span>
  <span class="app-release-hint" [attr.title]="releaseHintTooltip" tabindex="-1" aria-hidden="true"
    >v{{ webReleaseVersion }}</span>
  <span class="user-chip" *ngIf="authenticated">{{ username }}</span>
  <button mat-button type="button" *ngIf="authenticated" (click)="logout()">Log out</button>
</mat-toolbar>

<div class="shell">
  <section class="app-frame" aria-label="Main content" *ngIf="!onLoginRoute; else loginOnly">
    <header class="frame-tabs">
      <nav class="tab-nav" role="tablist" aria-label="Primary sections">
        <a
          class="tab-link"
          role="tab"
          routerLink="/exercise"
          routerLinkActive="tab-link--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Exercise
        </a>
        <a
          class="tab-link"
          role="tab"
          routerLink="/finance"
          routerLinkActive="tab-link--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Finance
        </a>
        <a
          class="tab-link"
          role="tab"
          routerLink="/management"
          routerLinkActive="tab-link--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Management
        </a>
        <a
          class="tab-link"
          role="tab"
          routerLink="/reports"
          routerLinkActive="tab-link--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Reports
        </a>
        <a
          class="tab-link"
          role="tab"
          routerLink="/admin"
          routerLinkActive="tab-link--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Admin
        </a>
        <a
          *ngIf="isAdmin"
          class="tab-link"
          role="tab"
          routerLink="/logs"
          routerLinkActive="tab-link--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Logs
        </a>
      </nav>
    </header>
    <div class="tab-panel">
      <main class="main">
        <router-outlet />
      </main>
    </div>
  </section>
  <ng-template #loginOnly>
    <main class="main login-main">
      <router-outlet />
    </main>
  </ng-template>
</div>
