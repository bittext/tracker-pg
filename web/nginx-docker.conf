# Preserve client TLS from an edge proxy (e.g. Caddy) when the hop to nginx is HTTP.
map $http_x_forwarded_proto $xf_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Match Spring multipart max-request-size (250MB). Default nginx is 1MB → HTML 413.
    # Recordings folder uploads and journal attachments both go through this hop.
    client_max_body_size 250m;

    # After a deploy, hashed filenames change. Browsers must not keep a stale index.html, or they
    # request old chunks that no longer exist. If those requests fell through to SPA fallback below,
    # nginx would return HTML for a .js URL and the browser reports "error loading dynamically imported module".
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Versioned build assets: real 404 when missing (never serve index.html for these).
    location ~* \.(?:js|mjs|css|map|json|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Same-origin /api/... as production builds (apiBaseUrl '').
    location /api/ {
        proxy_pass http://api:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $xf_proto;
        proxy_connect_timeout 30s;
        # Large multipart uploads (recordings folder) need more than the default 60s.
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Internet scanners often probe WordPress/PHP/CMS paths. This app is a static SPA + /api; return 404
    # instead of the Angular shell (which wrongly looked like a 200 “install” page in access logs).
    location ~* ^/(wp-(?:admin|includes|content)|wordpress)(/|$)|^/(wp-login\.php|xmlrpc\.php|wp-cron\.php|readme\.html|license\.txt|setup-config\.php)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
