# PostgreSQL Tracker — defaults match docker-compose in this project root.
# Override secrets via env or application-local.yml (gitignored).
spring:
  application:
    name: tracker-pg-server
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/tracker}
    username: ${SPRING_DATASOURCE_USERNAME:tracker}
    password: ${SPRING_DATASOURCE_PASSWORD:tracker}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      # Never auto-create or drop schema from entities — only Flyway migrations change the DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    # On each startup Flyway applies only *pending* migrations (new files). Already-applied versions are skipped.

server:
  port: ${SERVER_PORT:9091}
  # Listen on all interfaces inside Docker / LAN (default is already 0.0.0.0).
  address: ${SERVER_ADDRESS:0.0.0.0}
  # Trust X-Forwarded-* from nginx and from Caddy (TLS termination) so redirects and security see https.
  forward-headers-strategy: framework
  error:
    # Do not leak exception text or stack traces to API clients (details stay in server logs).
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Finance JDBC targets the local Flyway table (unquoted identifiers fold to lowercase in PostgreSQL).
tracker:
  security:
    # Strict-Transport-Security: enable only when the app is served over HTTPS (direct TLS or trusted TLS proxy).
    hsts-enabled: ${TRACKER_SECURITY_HSTS:false}
  journal:
    storage-directory: ${TRACKER_JOURNAL_STORAGE_DIR:}
    max-attachment-bytes: 20971520
    # If set (e.g. tracker-pg-journal), attachments go to S3; otherwise use storage-directory (or tmp).
    s3-bucket: ${TRACKER_JOURNAL_S3_BUCKET:}
    s3-region: ${TRACKER_JOURNAL_S3_REGION:us-east-1}
    # Lightsail buckets often need bucket-owner-full-control on put; leave empty for standard S3.
    s3-put-acl: ${TRACKER_JOURNAL_S3_PUT_ACL:}
  feedback:
    # Contact us: when set, ONLY these inboxes receive feedback (overrides ADMIN profile emails).
    admin-emails: ${TRACKER_FEEDBACK_ADMIN_EMAILS:}
    # Used when admin-emails is empty and no ADMIN has a member profile email.
    fallback-admin-emails: ${TRACKER_FEEDBACK_FALLBACK_ADMIN_EMAILS:}
    # Never notify these addresses (e.g. placeholder test inboxes on ADMIN profiles).
    excluded-admin-emails: ${TRACKER_FEEDBACK_EXCLUDED_ADMIN_EMAILS:}
  github:
    # Admin → Repository (GitHub) tab: REST v3 aggregate data (contributors, commits, stars, optional traffic).
    enabled: ${TRACKER_GITHUB_ENABLED:false}
    owner: ${TRACKER_GITHUB_OWNER:}
    repo: ${TRACKER_GITHUB_REPO:}
    # Classic PAT (ghp_…) or fine-grained (github_pat_…). Improves rate limits; required for private repos & traffic/views.
    api-token: ${TRACKER_GITHUB_TOKEN:}
  web:
    # Base URL for links in transactional account emails (first profile, password change). Override in production.
    public-app-url: ${TRACKER_WEB_PUBLIC_APP_URL:http://localhost:4200}
    cors-allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "http://[::1]:*"
  management:
    travel:
      # User-Agent for OpenStreetMap Nominatim (see OSM usage policy). No literal "https:" in the ${…:default} here —
      # Spring treats the first colon as the default separator. Override in production with TRACKER_TRAVEL_GEOCODE_USER_AGENT.
      geocode-user-agent: ${TRACKER_TRAVEL_GEOCODE_USER_AGENT:tracker-pg/10.0.0 (github.com/bittext/tracker-pg; travel geocode)}
    accounts:
      # AES-256-GCM sealing for Account password + authenticator key at rest (passphrase or Base64 32-byte key).
      # Empty = store plaintext (dev only); production deployments MUST set TRACKER_MANAGEMENT_ACCOUNTS_ENCRYPTION_KEY.
      encryption-key: ${TRACKER_MANAGEMENT_ACCOUNTS_ENCRYPTION_KEY:}
    recordings:
      # Just Press Record library (local Mac iCloud path). Disable or clear root on hosts without the folder.
      enabled: ${TRACKER_MANAGEMENT_RECORDINGS_ENABLED:true}
      root-path: ${TRACKER_MANAGEMENT_RECORDINGS_ROOT_PATH:/Users/pulickal/Library/Mobile Documents/iCloud~com~openplanetsoftware~just-press-record/Documents}
  auth:
    jwt-secret: ${TRACKER_AUTH_JWT_SECRET:dev-secret-change-me-dev-secret-change-me-dev-secret-change-me}
    jwt-ttl-seconds: ${TRACKER_AUTH_JWT_TTL_SECONDS:43200}
    # BCrypt cost (4–31). Default 12; raise in production if login latency allows.
    bcrypt-strength: ${TRACKER_AUTH_BCRYPT_STRENGTH:12}
    password-pepper: ${TRACKER_AUTH_PASSWORD_PEPPER:tracker-dev-pepper}
    bootstrap-admin-enabled: ${TRACKER_AUTH_BOOTSTRAP_ADMIN_ENABLED:true}
    bootstrap-admin-username: ${TRACKER_AUTH_BOOTSTRAP_ADMIN_USERNAME:admin}
    bootstrap-admin-password: ${TRACKER_AUTH_BOOTSTRAP_ADMIN_PASSWORD:admin123}
    trusted-location-days: ${TRACKER_AUTH_TRUSTED_LOCATION_DAYS:90}
    mfa-otp-ttl-seconds: ${TRACKER_AUTH_MFA_OTP_TTL_SECONDS:300}
    mfa-max-attempts: ${TRACKER_AUTH_MFA_MAX_ATTEMPTS:5}
    mfa-rate-limit-per-hour: ${TRACKER_AUTH_MFA_RATE_LIMIT_PER_HOUR:12}
    sms:
      enabled: ${TRACKER_AUTH_SMS_ENABLED:false}
      # log: OTP only in server logs. sns: Amazon SNS direct SMS (E.164).
      provider: ${TRACKER_AUTH_SMS_PROVIDER:log}
      aws-region: ${TRACKER_AUTH_SMS_AWS_REGION:}
      sms-sms-type: ${TRACKER_AUTH_SMS_SMS_TYPE:TRANSACTIONAL}
      sms-sender-id: ${TRACKER_AUTH_SMS_SMS_SENDER_ID:}
  finance:
    robinhood-table: robinhood_transactions
    max-transaction-rows: 10000
    transaction-date-column: activity_date
    transaction-date-quoted: false
    transaction-date-oracle-format-mask: ""
    stock-symbol-column: instrument
    stock-symbol-column-quoted: false
    stock-symbol-column-oracle-expr: ""
    max-symbol-list-rows: 5000
    max-stocks-summary-rows: 200000
    max-import-csv-bytes: 5000000
    import-preview-rows: 25
    max-import-errors: 25
    import-deduplicate: true
    robinhood-csv-import-directory: ""
    robinhood-csv-uploaded-directory: ""
    max-directory-import-files: 500
    # Flat rate for Reports → Finance → Robinhood estimated tax (0.22 = 22%). Not tax advice.
    robinhood-estimated-tax-rate: ${TRACKER_FINANCE_ROBINHOOD_ESTIMATED_TAX_RATE:0.22}
    # JupyterLab URL shown in Reports → Robinhood (optional). Example: http://127.0.0.1:8888/lab
    robinhood-jupyter-lab-url: ${TRACKER_FINANCE_ROBINHOOD_JUPYTER_LAB_URL:}
    robinhood-notebook-service-enabled: ${TRACKER_FINANCE_ROBINHOOD_NOTEBOOK_SERVICE_ENABLED:false}
    robinhood-notebook-service-base-url: ${TRACKER_FINANCE_ROBINHOOD_NOTEBOOK_SERVICE_BASE_URL:http://robinhood-notebook:8010}
    robinhood-notebook-service-timeout-ms: ${TRACKER_FINANCE_ROBINHOOD_NOTEBOOK_SERVICE_TIMEOUT_MS:120000}
    robinhood-cash-balance: ${TRACKER_FINANCE_ROBINHOOD_CASH_BALANCE:}
    robinhood-agentic:
      enabled: ${TRACKER_FINANCE_ROBINHOOD_AGENTIC_ENABLED:false}
      service-base-url: ${TRACKER_FINANCE_ROBINHOOD_AGENTIC_SERVICE_BASE_URL:http://robinhood-agent:8020}
      service-timeout-ms: ${TRACKER_FINANCE_ROBINHOOD_AGENTIC_SERVICE_TIMEOUT_MS:120000}
      token-encryption-key: ${TRACKER_FINANCE_ROBINHOOD_AGENTIC_TOKEN_ENCRYPTION_KEY:}
      sync-cron: ${TRACKER_FINANCE_ROBINHOOD_AGENTIC_SYNC_CRON:}
      sync-default-account-config: ${TRACKER_FINANCE_ROBINHOOD_AGENTIC_SYNC_DEFAULT:false} # true | false
      execution-enabled-config: ${TRACKER_FINANCE_ROBINHOOD_AGENTIC_EXECUTION_ENABLED:false} # true | false
      default-max-order-notional-config: ${TRACKER_FINANCE_ROBINHOOD_AGENTIC_DEFAULT_MAX_ORDER_NOTIONAL:}
      auto-trade:
        enabled-config: ${TRACKER_FINANCE_ROBINHOOD_AGENTIC_AUTO_TRADE_ENABLED:false}
        poll-fixed-delay-ms: ${TRACKER_FINANCE_ROBINHOOD_AGENTIC_AUTO_TRADE_POLL_MS:300000}
        poll-initial-delay-ms: ${TRACKER_FINANCE_ROBINHOOD_AGENTIC_AUTO_TRADE_INITIAL_DELAY_MS:120000}
    robinhood-agentic-banking:
      enabled: ${TRACKER_FINANCE_ROBINHOOD_AGENTIC_BANKING_ENABLED:false}
      service-base-url: ${TRACKER_FINANCE_ROBINHOOD_AGENTIC_BANKING_SERVICE_BASE_URL:${TRACKER_FINANCE_ROBINHOOD_AGENTIC_SERVICE_BASE_URL:http://robinhood-agent:8020}}
      service-timeout-ms: ${TRACKER_FINANCE_ROBINHOOD_AGENTIC_BANKING_SERVICE_TIMEOUT_MS:${TRACKER_FINANCE_ROBINHOOD_AGENTIC_SERVICE_TIMEOUT_MS:120000}}
      token-encryption-key: ${TRACKER_FINANCE_ROBINHOOD_AGENTIC_BANKING_TOKEN_ENCRYPTION_KEY:${TRACKER_FINANCE_ROBINHOOD_AGENTIC_TOKEN_ENCRYPTION_KEY:}}
    rh-daily-tracker:
      snapshot-scheduler-enabled-config: ${TRACKER_FINANCE_RH_DAILY_TRACKER_SNAPSHOT_ENABLED:true}
      # Every hour at :00 (Spring 6-field cron). Closing hour writes the official daily SCHEDULED row
      # (9 PM Eastern); later hourly pulls stay INTRADAY and do not replace that close.
      snapshot-cron: ${TRACKER_FINANCE_RH_DAILY_TRACKER_SNAPSHOT_CRON:0 0 * * * *}
      snapshot-zone: ${TRACKER_FINANCE_RH_DAILY_TRACKER_SNAPSHOT_ZONE:America/New_York}
      snapshot-closing-hour: ${TRACKER_FINANCE_RH_DAILY_TRACKER_SNAPSHOT_CLOSING_HOUR:21}
      # spulickal/nisha scope is hard-coded; optional map for future users: username -> "1234,5678"
      additional-owner-suffixes: {}
      excluded-account-suffixes: []
      alerts-enabled: ${TRACKER_FINANCE_RH_DAILY_TRACKER_ALERTS_ENABLED:true}
      ai:
        enabled: ${TRACKER_FINANCE_RH_DAILY_TRACKER_AI_ENABLED:false}
        api-key: ${TRACKER_FINANCE_RH_DAILY_TRACKER_AI_API_KEY:}
        base-url: ${TRACKER_FINANCE_RH_DAILY_TRACKER_AI_BASE_URL:https://api.openai.com/v1}
        model: ${TRACKER_FINANCE_RH_DAILY_TRACKER_AI_MODEL:gpt-4o-mini}
        timeout-ms: ${TRACKER_FINANCE_RH_DAILY_TRACKER_AI_TIMEOUT_MS:60000}
        max-output-tokens: ${TRACKER_FINANCE_RH_DAILY_TRACKER_AI_MAX_OUTPUT_TOKENS:1200}
        # Last-4 suffixes included in AI facts (Individual 3370, Agentic 3550, Ammu 8696).
        # Override with comma-separated TRACKER_FINANCE_RH_DAILY_TRACKER_AI_ACCOUNT_SUFFIXES if needed.
        account-suffixes: ${TRACKER_FINANCE_RH_DAILY_TRACKER_AI_ACCOUNT_SUFFIXES:3370,3550,8696}
    rh-crypto-tracker:
      snapshot-scheduler-enabled-config: ${TRACKER_FINANCE_RH_CRYPTO_TRACKER_SNAPSHOT_ENABLED:true}
      snapshot-cron: ${TRACKER_FINANCE_RH_CRYPTO_TRACKER_SNAPSHOT_CRON:0 0 */4 * * *}
    rh-crypto-auto-trade:
      enabled-config: ${TRACKER_FINANCE_RH_CRYPTO_AUTO_TRADE_ENABLED:false}
      poll-cron: ${TRACKER_FINANCE_RH_CRYPTO_AUTO_TRADE_POLL_CRON:0 */5 * * * *}
    banking:
      # Host default ~/imports/banking. Production VMs often use TRACKER_BANKING_IMPORT_DIRECTORY=/home/ubuntu/imports/banking (0700).
      import-directory: ${TRACKER_BANKING_IMPORT_DIRECTORY:${user.home}/imports/banking}
      max-upload-bytes: ${TRACKER_BANKING_MAX_UPLOAD_BYTES:20971520}
      # Plaid Link + /transactions pull → QFX written under import-directory/output-subdirectory, then same dedupe import as manual files.
      plaid:
        enabled: ${TRACKER_PLAID_ENABLED:false}
        client-id: ${TRACKER_PLAID_CLIENT_ID:}
        secret: ${TRACKER_PLAID_SECRET:}
        # sandbox | development (uses sandbox host) | production
        environment: ${TRACKER_PLAID_ENVIRONMENT:sandbox}
        # e.g. import-directory=/home/ubuntu/imports/banking and output-subdirectory=plaid → .../imports/banking/plaid/{user}/{institution}/...
        output-subdirectory: ${TRACKER_PLAID_OUTPUT_SUBDIRECTORY:plaid}
        # AES-256-GCM sealing for access_token in DB (passphrase or Base64 32-byte key). Empty = store plaintext (dev only).
        access-token-encryption-key: ${TRACKER_PLAID_ACCESS_TOKEN_ENCRYPTION_KEY:}
    news-enabled: true
    news-max-items: 10
    news-timeout-ms: 8000
    # When false, no HTTP calls are made to Alpha Vantage (quotes stay empty / stale cache).
    alpha-vantage-enabled: ${TRACKER_FINANCE_ALPHA_VANTAGE_ENABLED:false}
    alpha-vantage-api-key: ${TRACKER_FINANCE_ALPHA_VANTAGE_API_KEY:}
    alpha-vantage-base-url: ${TRACKER_FINANCE_ALPHA_VANTAGE_BASE_URL:https://www.alphavantage.co/query}
    predicts:
      # Finance → Trading → Predicts: community sentiment + attention analytics.
      enabled: ${TRACKER_FINANCE_PREDICTS_ENABLED:true}
      tracked-ticker-quota-per-user: ${TRACKER_FINANCE_PREDICTS_TRACKED_TICKER_QUOTA_PER_USER:25}
      baseline-window-days: ${TRACKER_FINANCE_PREDICTS_BASELINE_WINDOW_DAYS:30}
      retention:
        mentions-days: ${TRACKER_FINANCE_PREDICTS_RETENTION_MENTIONS_DAYS:60}
      stocktwits:
        # Public REST: https://api.stocktwits.com/api/2/streams/symbol/{ticker}.json (rate-limited to ~200/hr).
        enabled: ${TRACKER_FINANCE_PREDICTS_STOCKTWITS_ENABLED:true}
        max-messages-per-symbol: ${TRACKER_FINANCE_PREDICTS_STOCKTWITS_MAX_MESSAGES:30}
        poll-interval-seconds: ${TRACKER_FINANCE_PREDICTS_STOCKTWITS_POLL_SECONDS:1500}
        base-url: ${TRACKER_FINANCE_PREDICTS_STOCKTWITS_BASE_URL:https://api.stocktwits.com/api/2}
      reddit:
        # OAuth app (type: script). Required to ingest r/wallstreetbets, r/stocks, r/investing, r/options.
        enabled: ${TRACKER_FINANCE_PREDICTS_REDDIT_ENABLED:false}
        client-id: ${TRACKER_FINANCE_PREDICTS_REDDIT_CLIENT_ID:}
        client-secret: ${TRACKER_FINANCE_PREDICTS_REDDIT_CLIENT_SECRET:}
        # Reddit requires a unique User-Agent; including a contact identifier is recommended (their API rules).
        user-agent: ${TRACKER_FINANCE_PREDICTS_REDDIT_USER_AGENT:tracker-pg/10.0.0 (github.com/bittext/tracker-pg; finance-predicts)}
        base-url: ${TRACKER_FINANCE_PREDICTS_REDDIT_BASE_URL:https://oauth.reddit.com}
        # Comma-separated subreddits to scan each cycle (no leading r/).
        subreddits: ${TRACKER_FINANCE_PREDICTS_REDDIT_SUBREDDITS:wallstreetbets,stocks,investing,options}
        posts-per-subreddit: ${TRACKER_FINANCE_PREDICTS_REDDIT_POSTS_PER_SUBREDDIT:100}
        poll-interval-seconds: ${TRACKER_FINANCE_PREDICTS_REDDIT_POLL_SECONDS:900}
      x:
        # X / Twitter v2 (paid tier required as of 2024+).
        enabled: ${TRACKER_FINANCE_PREDICTS_X_ENABLED:false}
        bearer-token: ${TRACKER_FINANCE_PREDICTS_X_BEARER_TOKEN:}
        base-url: ${TRACKER_FINANCE_PREDICTS_X_BASE_URL:https://api.twitter.com/2}
      finbert:
        # Python sidecar (ProsusAI/finbert) reachable over the internal docker network.
        enabled: ${TRACKER_FINANCE_PREDICTS_FINBERT_ENABLED:true}
        base-url: ${TRACKER_FINANCE_PREDICTS_FINBERT_BASE_URL:http://finbert:8000}
        max-batch-size: ${TRACKER_FINANCE_PREDICTS_FINBERT_MAX_BATCH:64}
        timeout-ms: ${TRACKER_FINANCE_PREDICTS_FINBERT_TIMEOUT_MS:3500}
    alerts:
      evaluation-enabled: ${TRACKER_FINANCE_ALERTS_EVALUATION_ENABLED:true}
      poll-fixed-delay-ms: ${TRACKER_FINANCE_ALERTS_POLL_FIXED_DELAY_MS:3600000}
      default-cooldown-minutes: ${TRACKER_FINANCE_ALERTS_DEFAULT_COOLDOWN_MINUTES:1440}
      max-events-returned: ${TRACKER_FINANCE_ALERTS_MAX_EVENTS_RETURNED:50}
      email-enabled: ${TRACKER_FINANCE_ALERTS_EMAIL_ENABLED:false}
      email-from: ${TRACKER_FINANCE_ALERTS_EMAIL_FROM:}
      # ses (Amazon SES, default) | smtp (Spring JavaMail — set smtp-host, smtp-password; aws-region not required for email)
      email-transport: ${TRACKER_FINANCE_ALERTS_EMAIL_TRANSPORT:ses}
      smtp-host: ${TRACKER_FINANCE_ALERTS_SMTP_HOST:}
      smtp-port: ${TRACKER_FINANCE_ALERTS_SMTP_PORT:587}
      smtp-username: ${TRACKER_FINANCE_ALERTS_SMTP_USERNAME:}
      smtp-password: ${TRACKER_FINANCE_ALERTS_SMTP_PASSWORD:}
      smtp-debug: ${TRACKER_FINANCE_ALERTS_SMTP_DEBUG:false}
      sms-enabled: ${TRACKER_FINANCE_ALERTS_SMS_ENABLED:false}
      # Amazon SES + SNS (default AWS credential chain; verify SES identity for email-from). SMS still needs region.
      aws-region: ${TRACKER_FINANCE_ALERTS_AWS_REGION:}
      sms-sms-type: ${TRACKER_FINANCE_ALERTS_SMS_SMS_TYPE:TRANSACTIONAL}
      sms-sender-id: ${TRACKER_FINANCE_ALERTS_SMS_SENDER_ID:}
  logging:
    in-memory-max-lines: 800
    web-display-max-age-minutes: 30
    emit-level-samples-on-startup: true

logging:
  level:
    root: INFO
    # Flyway errors (checksum mismatch, SQL) often appear here before the generic entityManagerFactory failure.
    org.flywaydb: DEBUG
    com.svp.tracker: DEBUG
    com.svp.tracker.diagnostics: INFO
    com.svp.tracker.logging: DEBUG
    com.svp.tracker.config.ApiHttpLoggingFilter: INFO
    com.svp.tracker.admin: DEBUG
    com.svp.tracker.admin.controller.ServerLogsController: INFO
    com.svp.tracker.finance: DEBUG
    com.svp.tracker.finance.controller: DEBUG
    org.hibernate: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.springframework.jdbc.core: DEBUG
