# PostgreSQL Tracker — defaults match docker-compose in this project root.
# Override secrets via env or application-local.yml (gitignored).
spring:
  application:
    name: tracker-pg-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/tracker}
    username: ${SPRING_DATASOURCE_USERNAME:tracker}
    password: ${SPRING_DATASOURCE_PASSWORD:tracker}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      # Never auto-create or drop schema from entities — only Flyway migrations change the DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # On each startup Flyway applies only *pending* migrations (new files). Already-applied versions are skipped.

server:
  port: ${SERVER_PORT:9091}
  # Listen on all interfaces inside Docker / LAN (default is already 0.0.0.0).
  address: ${SERVER_ADDRESS:0.0.0.0}
  # Trust X-Forwarded-* from nginx and from Caddy (TLS termination) so redirects and security see https.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Finance JDBC targets the local Flyway table (unquoted identifiers fold to lowercase in PostgreSQL).
tracker:
  journal:
    storage-directory: ${TRACKER_JOURNAL_STORAGE_DIR:}
    max-attachment-bytes: 8388608
    # If set (e.g. tracker-pg-journal), attachments go to S3; otherwise use storage-directory (or tmp).
    s3-bucket: ${TRACKER_JOURNAL_S3_BUCKET:}
    s3-region: ${TRACKER_JOURNAL_S3_REGION:us-east-1}
  web:
    cors-allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "http://[::1]:*"
  auth:
    jwt-secret: ${TRACKER_AUTH_JWT_SECRET:dev-secret-change-me-dev-secret-change-me-dev-secret-change-me}
    jwt-ttl-seconds: ${TRACKER_AUTH_JWT_TTL_SECONDS:43200}
    password-pepper: ${TRACKER_AUTH_PASSWORD_PEPPER:tracker-dev-pepper}
    bootstrap-admin-enabled: ${TRACKER_AUTH_BOOTSTRAP_ADMIN_ENABLED:true}
    bootstrap-admin-username: ${TRACKER_AUTH_BOOTSTRAP_ADMIN_USERNAME:admin}
    bootstrap-admin-password: ${TRACKER_AUTH_BOOTSTRAP_ADMIN_PASSWORD:admin123}
    trusted-location-days: ${TRACKER_AUTH_TRUSTED_LOCATION_DAYS:90}
    mfa-otp-ttl-seconds: ${TRACKER_AUTH_MFA_OTP_TTL_SECONDS:300}
    mfa-max-attempts: ${TRACKER_AUTH_MFA_MAX_ATTEMPTS:5}
    mfa-rate-limit-per-hour: ${TRACKER_AUTH_MFA_RATE_LIMIT_PER_HOUR:12}
    sms:
      enabled: ${TRACKER_AUTH_SMS_ENABLED:false}
      provider: ${TRACKER_AUTH_SMS_PROVIDER:log}
      twilio-account-sid: ${TRACKER_AUTH_SMS_TWILIO_ACCOUNT_SID:}
      twilio-auth-token: ${TRACKER_AUTH_SMS_TWILIO_AUTH_TOKEN:}
      twilio-from-number: ${TRACKER_AUTH_SMS_TWILIO_FROM_NUMBER:}
  finance:
    robinhood-table: robinhood_transactions
    max-transaction-rows: 10000
    transaction-date-column: activity_date
    transaction-date-quoted: false
    transaction-date-oracle-format-mask: ""
    stock-symbol-column: instrument
    stock-symbol-column-quoted: false
    stock-symbol-column-oracle-expr: ""
    max-symbol-list-rows: 5000
    max-stocks-summary-rows: 200000
    max-import-csv-bytes: 5000000
    import-preview-rows: 25
    max-import-errors: 25
    import-deduplicate: true
    robinhood-csv-import-directory: ""
    robinhood-csv-uploaded-directory: ""
    max-directory-import-files: 500
    news-enabled: true
    news-max-items: 10
    news-timeout-ms: 8000
    alerts:
      evaluation-enabled: ${TRACKER_FINANCE_ALERTS_EVALUATION_ENABLED:true}
      poll-fixed-delay-ms: ${TRACKER_FINANCE_ALERTS_POLL_FIXED_DELAY_MS:300000}
      default-cooldown-minutes: ${TRACKER_FINANCE_ALERTS_DEFAULT_COOLDOWN_MINUTES:1440}
      max-events-returned: ${TRACKER_FINANCE_ALERTS_MAX_EVENTS_RETURNED:50}
      email-enabled: ${TRACKER_FINANCE_ALERTS_EMAIL_ENABLED:false}
      email-from: ${TRACKER_FINANCE_ALERTS_EMAIL_FROM:}
      sms-enabled: ${TRACKER_FINANCE_ALERTS_SMS_ENABLED:false}
      twilio-account-sid: ${TRACKER_FINANCE_ALERTS_TWILIO_ACCOUNT_SID:}
      twilio-auth-token: ${TRACKER_FINANCE_ALERTS_TWILIO_AUTH_TOKEN:}
      twilio-from-number: ${TRACKER_FINANCE_ALERTS_TWILIO_FROM_NUMBER:}
  logging:
    in-memory-max-lines: 800
    web-display-max-age-minutes: 30
    emit-level-samples-on-startup: true

logging:
  level:
    root: INFO
    com.svp.tracker: DEBUG
    com.svp.tracker.diagnostics: INFO
    com.svp.tracker.logging: DEBUG
    com.svp.tracker.config.ApiHttpLoggingFilter: INFO
    com.svp.tracker.admin: DEBUG
    com.svp.tracker.admin.controller.ServerLogsController: INFO
    com.svp.tracker.finance: DEBUG
    com.svp.tracker.finance.controller: DEBUG
    org.hibernate: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.springframework.jdbc.core: DEBUG
