# Default: Postgres only (port 5433). Use for local `mvn spring-boot:run` against localhost.
# API in Docker (optional): docker compose --profile api up -d --build
#
# Pinned project name so the stack is always "tracker-pg-*" even when compose is run from a parent directory
# (avoids duplicate api/web containers and name conflicts on the same Docker host).
name: tracker-pg

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      - "5433:5432"
    volumes:
      - tracker_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tracker
      SPRING_DATASOURCE_USERNAME: tracker
      SPRING_DATASOURCE_PASSWORD: tracker
      SERVER_PORT: 9091
    ports:
      - "9091:9091"

volumes:
  tracker_pg_data:
